<!-- Compact: identity bar — show only the canonical protein change, no transcripts -->
<span class="variant-protein" *ngIf="compact && candidates?.length" [@toggle]>
  {{ candidates[0].annot }}
</span>

<!-- Full: gene summary section -->
<div class="fa-wrap" *ngIf="!compact && candidates" [@toggle]>
  <span class="fa-label">Protein Change</span>
  <div class="fa-list">
    <span *ngFor="let cand of candidates" class="fa-annot">
      {{ cand.annot }}
      (<span *ngFor="let trpt of cand.transcripts" class="fa-trpt">
        <a [attr.href]="trpt.extLink" target="_blank">{{ trpt.transcriptId }}</a>
        <span class="chip chip-primary" *ngIf="trpt.isCanonical">Ensembl canonical</span>
      </span>)
    </span>
  </div>
</div>
