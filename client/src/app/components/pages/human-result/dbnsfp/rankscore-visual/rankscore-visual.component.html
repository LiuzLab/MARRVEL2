<svg height="25" width="60" *ngIf="rankscore?.toFixed">
  <text x="0" y="25" font-size="12px" text-anchor="start" fill="#b8c5d3">0</text>
  <line x1="13" y1="20" x2="47" y2="20" stroke="#3d4f63"></line>
  <circle
    [attr.cx]="rankscore * 34 + 13"
    cy="20" r="3"
    stroke-width="1" stroke="#8b98a8"
    [attr.fill]="getColor(rankscore)"
  ></circle>
  <text x="60" y="25" font-size="12px" text-anchor="end" fill="#b8c5d3">1</text>
  <text
    [attr.x]="rankscore * 34 + 13"
    y="10"
    font-size="10px" text-anchor="middle"
    fill="#b8c5d3"
  >{{ rankscore.toFixed(4) }}</text>
</svg>
